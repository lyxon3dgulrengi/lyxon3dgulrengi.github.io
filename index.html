<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاتحاد النسائي للون الورد الدولي</title>
<meta name="description" content="تواصل مع الاتحاد النسائي للون الورد الدولي عبر إنستغرام وواتساب">
<meta property="og:title" content="الاتحاد النسائي للون الورد الدولي">
<meta property="og:description" content="International Women's Union of Rose Color · Gül Rengi">
<meta property="og:image" content="logo.jpg?v=2">
<link rel="icon" href="favicon.png?v=2">
<style>
  :root {
    --pink: #E8508C;
    --pink-deep: #B92E5D;
    --gold: #C9962B;
    --ink: #3b1020;
    --bg: #fff5f7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #ffe3ec 0%, var(--bg) 55%, #fff 100%);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%; max-width: 420px; text-align: center;
    background: var(--card);
    border: 2px solid var(--gold);
    border-radius: 28px;
    padding: 28px 22px 24px;
    box-shadow: 0 18px 50px rgba(185, 46, 93, .15);
  }
  .logo {
    width: 230px; height: 230px; border-radius: 22px;
    object-fit: cover; display: block; margin: 0 auto 16px;
    box-shadow: 0 6px 22px rgba(201, 150, 43, .35);
  }
  h1 { font-size: 1.45rem; line-height: 1.5; margin: 0 0 6px; color: var(--pink-deep); }
  .sub { margin: 0; font-size: .92rem; line-height: 1.7; color: #6b3a4a; direction: ltr; }
  .rule { height: 2px; width: 70%; margin: 18px auto 20px;
          background: linear-gradient(90deg, transparent, var(--gold), transparent); border: 0; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 16px 18px; margin: 0 0 14px;
    border-radius: 16px; text-decoration: none; font-size: 1.12rem; font-weight: 700;
    color: #fff; transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .12);
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn svg { width: 26px; height: 26px; flex: none; fill: #fff; }
  .insta { background: linear-gradient(135deg, #E8508C, #B92E5D); }
  .wa    { background: linear-gradient(135deg, #2bb673, #128c7e); }
  .hint { margin: 6px 0 0; font-size: .8rem; color: #8a5a69; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.jpg?v=2" alt="شعار الاتحاد النسائي للون الورد الدولي">
  <h1>الاتحاد النسائي<br>للون الورد الدولي</h1>
  <p class="sub">International Women’s Union of Rose Color<br>Uluslararası Gül Rengi Kadınlar Birliği</p>
  <hr class="rule">

  <a class="btn insta" href="https://www.instagram.com/gul_rengi_toplulugu/" target="_blank" rel="noopener">

    تابعنا على إنستغرام

  <p class="hint">Gül Rengi · 2019</p>
</main>
</body>
</html>
